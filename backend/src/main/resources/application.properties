spring.application.name=budget
# Base de données (valeurs par défaut = celles du .env de dev)
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:budget}
spring.datasource.username=${DB_USER:budget}
spring.datasource.password=${DB_PASSWORD:budget_dev_pwd}
# Le schéma est géré par Flyway, Hibernate vérifie seulement
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false